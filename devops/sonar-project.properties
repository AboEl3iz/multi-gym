# ── SonarQube Project Configuration ─────────────────────────────────────────
# This file is read by sonar-scanner during Stage 2.3 of the CI pipeline.
# The authentication token is NOT stored here — it is injected at runtime
# via the SONAR_TOKEN Jenkins credential (never hardcoded).
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=gym
sonar.projectName=Gym Management API
sonar.projectVersion=1.0

# ── Source & Test paths ───────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**

# ── Language ──────────────────────────────────────────────────────────────────
sonar.language=ts

# ── TypeScript-specific ───────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json

# ── Coverage report (produced by jest --coverage) ────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/migrations/**

# ── Quality Gate thresholds (enforced in Jenkins via waitForQualityGate) ─────
# Minimum test coverage: 60%
# Max duplicated lines: 3%
# Zero new CRITICAL/BLOCKER issues allowed

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
