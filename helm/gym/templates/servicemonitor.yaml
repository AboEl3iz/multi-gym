{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gym.fullname" . }}-app
  # ServiceMonitor must live in the Prometheus operator's namespace
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  labels:
    {{- include "gym.labels" . | nindent 4 }}
    # Label required by kube-prometheus-stack's default serviceMonitorSelector
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "gym.app.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}
