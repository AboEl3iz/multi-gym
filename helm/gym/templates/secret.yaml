apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gym.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gym.labels" . | nindent 4 }}
  annotations:
    # Remind operators that this Secret must never contain real values at rest in git.
    # Use: helm install gym ./helm/gym --set secrets.postgresPassword="$(vault kv get ...)"
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Values are base64-encoded by Helm at install time.
  # ⚠️ NEVER commit real credentials — override via --set or external secret provider.
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  jwt-secret:        {{ .Values.secrets.jwtSecret        | b64enc | quote }}
  email-password:    {{ .Values.secrets.emailPassword     | b64enc | quote }}
