# ══════════════════════════════════════════════════════════════════════════════
#  Prometheus Alert Rules — Gym App
#  Stage 6: Monitoring & Alerting
#
#  Used by:
#   • docker-compose: mounted directly at /etc/prometheus/alerts.yml
#   • Kubernetes: rendered into a PrometheusRule CRD via Helm template
#
#  Severity conventions:
#    critical → page immediately (PagerDuty / Slack #incidents)
#    warning  → investigate within 30 min (Slack #alerts)
#    info     → awareness only
# ══════════════════════════════════════════════════════════════════════════════

groups:

  # ── 6.1 Infrastructure availability ───────────────────────────────────────
  - name: infrastructure
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Instance {{ $labels.instance }} is DOWN"
          description: >-
            Job '{{ $labels.job }}' target '{{ $labels.instance }}' has been
            unreachable for more than 1 minute. Check pod status immediately.
          runbook: "kubectl get pods -n gym-app && kubectl describe pod -l app.kubernetes.io/component=app -n gym-app"

      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="gym-app"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping in {{ $labels.namespace }}"
          description: >-
            Container '{{ $labels.container }}' in pod '{{ $labels.pod }}'
            has been restarting continuously for 2+ minutes.
          runbook: "kubectl logs {{ $labels.pod }} -n gym-app --previous"

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="true", namespace="gym-app"} == 0
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is NOT ready"
          description: >-
            Pod '{{ $labels.pod }}' in namespace 'gym-app' has been in a
            non-ready state for more than 3 minutes.

  # ── 6.2 Application HTTP health ────────────────────────────────────────────
  - name: application-http
    rules:
      - alert: HighHttpErrorRate
        expr: |
          rate(http_request_duration_seconds_count{code=~"5.."}[1m])
          /
          rate(http_request_duration_seconds_count[1m]) > 0.05
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.instance }}"
          description: >-
            The HTTP 5xx error rate has exceeded 5% for more than 1 minute
            on instance '{{ $labels.instance }}'. Current rate: {{ $value | printf "%.2f" }}.
          runbook: "kubectl logs -l app.kubernetes.io/component=app -n gym-app --tail=200"

      - alert: HighHttpLatencyP99
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1.0
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P99 HTTP latency > 1s on {{ $labels.instance }}"
          description: >-
            The 99th percentile HTTP request latency has been above 1 second
            for 3+ minutes. Current P99: {{ $value | printf "%.3f" }}s.

      - alert: HighRequestRate
        expr: |
          rate(http_request_duration_seconds_count[1m]) > 500
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Traffic spike on {{ $labels.instance }}"
          description: >-
            Request rate has exceeded 500 req/min for 2 minutes (possible DDoS
            or load spike). Consider scaling via HPA.

      - alert: NoTraffic
        expr: |
          rate(http_request_duration_seconds_count[5m]) == 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Zero inbound traffic on {{ $labels.instance }}"
          description: >-
            No HTTP requests have been received in the last 5 minutes.
            This may indicate a networking issue, misconfigured Service, or
            complete upstream failure.

  # ── 6.3 Resource usage ─────────────────────────────────────────────────────
  - name: resource-usage
    rules:
      - alert: HighMemoryUsage
        expr: |
          container_memory_working_set_bytes{namespace="gym-app", container="gym-app"}
          /
          container_spec_memory_limit_bytes{namespace="gym-app", container="gym-app"} > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Memory usage > 85% in {{ $labels.pod }}"
          description: >-
            Pod '{{ $labels.pod }}' is using more than 85% of its memory limit.
            OOMKill risk. Current usage: {{ $value | printf "%.1f" }}%.
          runbook: "kubectl top pods -n gym-app"

      - alert: HighCpuThrottling
        expr: |
          rate(container_cpu_cfs_throttled_seconds_total{namespace="gym-app", container="gym-app"}[5m])
          /
          rate(container_cpu_cfs_periods_total{namespace="gym-app", container="gym-app"}[5m]) > 0.50
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "CPU throttling > 50% in {{ $labels.pod }}"
          description: >-
            Pod '{{ $labels.pod }}' is being CPU-throttled more than 50% of the time.
            Consider increasing CPU limits or optimising the application.

  # ── 6.4 Database health ─────────────────────────────────────────────────────
  - name: database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL is DOWN"
          description: >-
            The PostgreSQL instance is unreachable. All database-dependent
            API calls will fail immediately.
          runbook: "kubectl get pods -n gym-app -l app.kubernetes.io/component=db"

      - alert: PostgresHighConnections
        expr: |
          pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL connection count high ({{ $value }})"
          description: >-
            The number of active PostgreSQL connections has exceeded 80.
            Default max_connections is 100. Connection pool exhaustion is imminent.

      - alert: PostgresReplicationLag
        expr: |
          pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL replication lag > 30s"
          description: "Replication lag is {{ $value }}s. Standby may be falling behind."

  # ── 6.5 CI/CD pipeline health ────────────────────────────────────────────
  - name: cicd
    rules:
      - alert: AiServiceDown
        expr: |
          up{job="ai-devops-service"} == 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "AI DevOps Service is unreachable"
          description: >-
            The AI DevOps Service has been down for 2+ minutes.
            CD pipeline AI analysis steps will use fallback values.
          runbook: "kubectl get pods -n devops -l app=ai-devops-service"

  # ── 6.6 Slack integration test (keep as info, fire-and-forget) ──────────
  - name: connectivity-tests
    rules:
      - alert: SlackIntegrationTest
        expr: vector(1) == 1
        for: 10s
        labels:
          severity: info
        annotations:
          summary: "✅ Alertmanager → Slack pipeline is working"
          description: >-
            This is a permanent test alert. If you see this in Slack,
            Prometheus → Alertmanager → Slack routing is correctly configured.
